Sim. Abaixo está o httpd-vhosts.conf completo, mantendo sua configuração e colocando os comentários diretamente no formato que você pode colar no arquivo do Apache.

# =====================================================================
# httpd-vhosts.conf
# =====================================================================
#
# CONFIGURAÇÃO DO VIRTUAL HOST DA APLICAÇÃO
#
# Estrutura física:
#
# C:\xampp\htdocs
#     │
#     └── Studying_Design-Patterns
#             │
#             ├── public
#             │
#             └── with_php
#
#
# Fluxo desejado:
#
# ACESSO LOCAL
#
#   localhost/Studying_Design-Patterns
#   127.0.0.1/Studying_Design-Patterns
#   ::1/Studying_Design-Patterns
#
#             │
#             ▼
#   /Studying_Design-Patterns/public
#
#
# ACESSO REMOTO
#
#   <IP-remoto>/Studying_Design-Patterns
#
#             │
#             ▼
#   /with_php
#
#
# IMPORTANTE:
#
# localhost pode ser resolvido pelo sistema como:
#
#   ::1
#
# ou:
#
#   127.0.0.1
#
# Por isso existem duas regras locais separadas.
#
# =====================================================================



# =====================================================================
# VIRTUAL HOST PRINCIPAL
# =====================================================================

<VirtualHost *:80>

    # E-mail administrativo do servidor.
    # Não interfere no funcionamento do roteamento.
    ServerAdmin ti@ipaconline.com.br


    # -----------------------------------------------------------------
    # DOCUMENT ROOT
    # -----------------------------------------------------------------
    #
    # Define a raiz física deste VirtualHost.
    #
    # Portanto:
    #
    #   http://localhost/
    #
    # corresponde inicialmente a:
    #
    #   C:\xampp\htdocs\
    #
    DocumentRoot "C:\xampp\htdocs"



    # =================================================================
    # CONFIGURAÇÃO DO DOCUMENT ROOT
    # =================================================================
    #
    # Este bloco controla:
    #
    #   C:\xampp\htdocs
    #
    # =================================================================

    <Directory "C:\xampp\htdocs">

        # Permite acesso aos arquivos e diretórios.
        Require all granted

        # Não permite que .htaccess altere esta configuração.
        AllowOverride None

        # Arquivos padrão quando uma pasta é acessada.
        #
        # Exemplo:
        #
        #   http://localhost/
        #
        # procura:
        #
        #   index.php
        #   index.html
        #
        DirectoryIndex index.php index.html

    </Directory>



    # =================================================================
    # =================================================================
    # CAMADA 1
    # REDIRECIONAMENTO POR IP
    # =================================================================
    # =================================================================
    #
    # Diretório físico:
    #
    #   C:\xampp\htdocs\Studying_Design-Patterns
    #
    #
    # Esta camada é responsável apenas por decidir:
    #
    #        QUEM ESTÁ ACESSANDO?
    #
    #                 │
    #        ┌────────┴────────┐
    #        │                 │
    #      LOCAL             REMOTO
    #        │                 │
    #        ▼                 ▼
    #     /public          /with_php
    #
    # =================================================================

    <Directory "C:\xampp\htdocs\Studying_Design-Patterns">

        # Não permite que o Apache mostre uma listagem dos arquivos
        # caso não exista um index.
        Options -Indexes


        # -------------------------------------------------------------
        # Require all denied
        # -------------------------------------------------------------
        #
        # Está comentado.
        #
        # Se fosse ativado:
        #
        #   Require all denied
        #
        # todo acesso a este diretório seria bloqueado.
        #
        # Portanto deixamos comentado para permitir que as regras
        # específicas abaixo controlem o acesso.
        #
        #Require all denied


        <IfModule rewrite_module>

            # Ativa o mod_rewrite.
            RewriteEngine On



            # =========================================================
            # REGRA 1A
            # LOCAL IPv4
            #
            # 127.0.0.1 → /public
            # =========================================================
            #
            # Exemplo:
            #
            #   http://127.0.0.1/Studying_Design-Patterns/
            #
            #       ↓
            #
            #   /Studying_Design-Patterns/public
            #
            # =========================================================


            # ---------------------------------------------------------
            # Verifica se o cliente é exatamente 127.0.0.1.
            #
            # %{REMOTE_ADDR}
            #
            # representa o IP do cliente que fez a requisição.
            # ---------------------------------------------------------

            RewriteCond %{REMOTE_ADDR} ^127\.0\.0\.1$


            # ---------------------------------------------------------
            # Não redirecionar novamente se já estiver em /public.
            #
            # Isso evita:
            #
            #   /Studying_Design-Patterns
            #              ↓
            #   /Studying_Design-Patterns/public
            #              ↓
            #   /Studying_Design-Patterns/public
            #              ↓
            #   LOOP
            # ---------------------------------------------------------

            RewriteCond %{REQUEST_URI} !^/Studying_Design-Patterns/public(?:/|$)


            # ---------------------------------------------------------
            # Não interferir com /with_php.
            #
            # Embora /with_php seja uma URL separada, fisicamente a
            # pasta está dentro de:
            #
            #   C:\xampp\htdocs\Studying_Design-Patterns
            #
            # Por isso precisamos impedir que a Camada 1 capture
            # requisições destinadas ao Alias /with_php.
            # ---------------------------------------------------------

            RewriteCond %{REQUEST_URI} !^/with_php(?:/|$)


            # ---------------------------------------------------------
            # Redirecionamento.
            #
            # R=302:
            #   redirecionamento HTTP temporário.
            #
            # L:
            #   última regra deste processamento.
            # ---------------------------------------------------------

            RewriteRule ^(.*)$ /Studying_Design-Patterns/public [R=302,L]



            # =========================================================
            # REGRA 1B
            # LOCAL IPv6
            #
            # ::1 → /public
            # =========================================================
            #
            # localhost pode ser resolvido para ::1.
            #
            # Por isso tratamos ::1 separadamente.
            #
            # Exemplo:
            #
            #   http://localhost/Studying_Design-Patterns/
            #
            # pode chegar ao Apache como:
            #
            #   REMOTE_ADDR = ::1
            #
            # e então:
            #
            #   /Studying_Design-Patterns
            #
            #       ↓
            #
            #   /Studying_Design-Patterns/public
            #
            # =========================================================


            # Cliente é exatamente ::1.
            RewriteCond %{REMOTE_ADDR} ^::1$


            # Não redirecionar novamente se já estiver em /public.
            RewriteCond %{REQUEST_URI} !^/Studying_Design-Patterns/public(?:/|$)


            # Não interferir com /with_php.
            RewriteCond %{REQUEST_URI} !^/with_php(?:/|$)


            # Redireciona para /public.
            RewriteRule ^(.*)$ /Studying_Design-Patterns/public [R=302,L]



            # =========================================================
            # REGRA 2
            # ACESSO REMOTO
            #
            # IP remoto → /with_php
            # =========================================================
            #
            # Esta regra só será considerada quando o IP:
            #
            #   NÃO for 127.0.0.1
            #   NÃO for ::1
            #   NÃO for 192.168.1.172
            #
            # Ou seja:
            #
            #   IP externo
            #
            #       ↓
            #
            #   /with_php
            #
            # =========================================================


            # Não pode ser localhost IPv4.
            RewriteCond %{REMOTE_ADDR} !^127\.0\.0\.1$


            # Não pode ser localhost IPv6.
            RewriteCond %{REMOTE_ADDR} !^::1$


            # Não pode ser o IP 192.168.1.172.
            #
            # Este IP foi colocado como exceção.
            RewriteCond %{REMOTE_ADDR} !^192\.168\.1\.172$


            # A requisição precisa estar tentando acessar
            # /Studying_Design-Patterns.
            #
            # Assim esta regra não interfere em qualquer outra
            # aplicação ou URL do servidor.
            RewriteCond %{REQUEST_URI} ^/Studying_Design-Patterns


            # Se já estiver em /public, não redirecionar.
            RewriteCond %{REQUEST_URI} !^/Studying_Design-Patterns/public(?:/|$)


            # Se já estiver em /with_php, não redirecionar novamente.
            RewriteCond %{REQUEST_URI} !^/with_php(?:/|$)


            # Redireciona para /with_php.
            RewriteRule ^(.*)$ /with_php [R=302,L]

        </IfModule>

    </Directory>



    # =================================================================
    # =================================================================
    # CAMADA 2
    # FRONT CONTROLLER
    # =================================================================
    # =================================================================
    #
    # Diretório físico:
    #
    #   C:\xampp\htdocs\Studying_Design-Patterns\public
    #
    #
    # URL:
    #
    #   /Studying_Design-Patterns/public
    #
    #
    # Esta camada recebe o acesso LOCAL.
    #
    # Depois, o index.php funciona como Front Controller.
    #
    # Exemplo:
    #
    #   /Studying_Design-Patterns/public/login
    #
    #                     ↓
    #
    #              public/index.php
    #
    #                     ↓
    #
    #              rota=login
    #
    # =================================================================

    <Directory "C:\xampp\htdocs\Studying_Design-Patterns\public">

        # Permite acesso ao diretório public.
        Require all granted


        # Não permite configuração através de .htaccess.
        AllowOverride None


        # Arquivo padrão.
        DirectoryIndex index.php index.html



        # =============================================================
        # PROTEÇÃO DE ARQUIVOS SENSÍVEIS
        # =============================================================
        #
        # Bloqueia acesso direto a:
        #
        #   .env
        #   .bak
        #   .sql
        #
        # Esses arquivos podem conter informações sensíveis.
        # =============================================================

        <FilesMatch "\.(env|bak|sql)$">
            Require all denied
        </FilesMatch>



        # =============================================================
        # PROTEÇÃO DOS ARQUIVOS PHP
        # =============================================================
        #
        # Permite diretamente apenas:
        #
        #   index.php
        #
        # Outros arquivos PHP ficam bloqueados.
        #
        # Exemplo:
        #
        #   index.php  → permitido
        #   teste.php  → bloqueado
        #   config.php → bloqueado
        #
        # =============================================================

        <FilesMatch "^(?!index\.php$).*\.ph(p[0-9]?|tml)$">
            Require all denied
        </FilesMatch>



        # =============================================================
        # FRONT CONTROLLER
        # =============================================================

        <IfModule rewrite_module>

            # Ativa mod_rewrite.
            RewriteEngine On


            # ---------------------------------------------------------
            # Se não for um arquivo físico existente...
            # ---------------------------------------------------------

            RewriteCond %{REQUEST_FILENAME} !-f


            # ---------------------------------------------------------
            # ...e também não for um diretório físico existente...
            # ---------------------------------------------------------

            RewriteCond %{REQUEST_FILENAME} !-d


            # ---------------------------------------------------------
            # Não aplicar ao index.php.
            # ---------------------------------------------------------

            RewriteCond %{REQUEST_URI} !=^/index.php$


            # ---------------------------------------------------------
            # Envia a requisição para index.php.
            #
            # $1 contém a rota capturada.
            #
            # Exemplo:
            #
            #   /login
            #
            # pode virar internamente:
            #
            #   index.php?rota=login
            #
            # QSA:
            #   mantém os parâmetros GET existentes.
            #
            # L:
            #   encerra o processamento das regras.
            # ---------------------------------------------------------

            RewriteRule ^(.*)$ index.php?rota=$1 [QSA,L]

        </IfModule>

    </Directory>



    # =================================================================
    # =================================================================
    # CAMADA 3
    # ALIAS /with_php
    # =================================================================
    # =================================================================
    #
    # Aqui criamos um "apelido" de URL.
    #
    # URL:
    #
    #   /with_php
    #
    # aponta fisicamente para:
    #
    #   C:\xampp\htdocs\Studying_Design-Patterns\with_php
    #
    #
    # Portanto:
    #
    #   http://127.0.0.1/with_php
    #
    #       ↓
    #
    #   C:\xampp\htdocs\Studying_Design-Patterns\with_php
    #
    # =================================================================


    Alias "/with_php" "C:\xampp\htdocs\Studying_Design-Patterns\with_php"



    # =================================================================
    # CONFIGURAÇÃO DO DIRETÓRIO FÍSICO DO ALIAS
    # =================================================================

    <Directory "C:\xampp\htdocs\Studying_Design-Patterns\with_php">

        # Permite acesso.
        Require all granted


        # Não utilizar .htaccess.
        AllowOverride None


        # Permite listagem e links simbólicos.
        Options Indexes FollowSymLinks


        # Arquivo padrão.
        DirectoryIndex index.php index.html



        # =============================================================
        # MÉTODOS HTTP PERMITIDOS
        # =============================================================
        #
        # Permite somente:
        #
        #   GET
        #   HEAD
        #   POST
        #
        # Outros métodos são bloqueados.
        #
        # Exemplos:
        #
        #   PUT     → bloqueado
        #   DELETE  → bloqueado
        #   PATCH   → bloqueado
        #
        # =============================================================

        <If "!(%{REQUEST_METHOD} -in {'GET', 'HEAD', 'POST'})">
            Require all denied
        </If>



        # =============================================================
        # REGRAS DE ROTEAMENTO FUTURAS
        # =============================================================
        #
        # Este bloco está DESATIVADO.
        #
        # Ele poderá futuramente criar regras como:
        #
        #   /with_php/i...
        #
        #       ↓
        #
        #   /with_php/introduction/
        #
        #
        # e:
        #
        #   /with_php/s...
        #
        #       ↓
        #
        #   /with_php/strategy/
        #
        # =============================================================


        #<IfModule rewrite_module>

            # Ativa mod_rewrite.
            #RewriteEngine On


            # Não reescrever arquivos físicos.
            #RewriteCond %{REQUEST_FILENAME} !-f

            # Não reescrever diretórios físicos.
            #RewriteCond %{REQUEST_FILENAME} !-d


            # =========================================================
            # ROTAS COMEÇANDO COM "i"
            # =========================================================

            #RewriteCond %{REQUEST_URI} ^/with_php/i

            # Evita loop.
            #RewriteCond %{REQUEST_URI} !^/with_php/introduction/$

            # Redirecionamento.
            #RewriteRule ^(.*)$ /with_php/introduction/ [R=302,L]


            # =========================================================
            # ROTAS COMEÇANDO COM "s"
            # =========================================================

            #RewriteCond %{REQUEST_URI} ^/with_php/s

            # Evita loop.
            #RewriteCond %{REQUEST_URI} !^/with_php/strategy/$

            # Redirecionamento.
            #RewriteRule ^(.*)$ /with_php/strategy/ [R=302,L]

        #</IfModule>

    </Directory>


</VirtualHost>



